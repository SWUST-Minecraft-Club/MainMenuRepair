plugins {
	id 'java'
}

// 为什么不用 fabric-loom：
//   26.3 客户端不再混淆，Fabric 也没有 26.3 的 yarn/intermediary —— 编译不需要 mappings，构建也不需要 remap。
//   而 maven.fabricmc.net 在部分网络环境下会被限速到 KB 级（Loom 自身依赖很多，会卡在下载上），
//   所以这里直接手工编译：编译期只需要「官方客户端 jar」+「注解桩」，
//   后者用 src/mixin-stubs/java 里的同名注解桩（Mixin 注解、Fabric API 与 Loader 的少量接口），
//   不引入任何外部依赖。

group = project.group
version = project.version

base {
	archivesName = project.archives_base_name
}

// 不声明 Java toolchain：直接用当前 JDK 编译（避免 Gradle fork worker daemon，部分机器上会起不来），
// 字节码版本由下面的 options.release = 25 保证。

def clientJar = layout.buildDirectory.file("minecraft/client-${project.minecraft_version}.jar")

// 注解桩：单独 sourceSet，只参与编译，不打进模组 jar
sourceSets {
	mixinStubs {
		java.srcDir 'src/mixin-stubs/java'
		// 桩里引用了 Minecraft 类（例如 ScreenEvents.AfterInit 的参数类型），所以需要客户端 jar
		compileClasspath = files(clientJar)
		runtimeClasspath = files()
	}
}

// 下载官方客户端 jar（26.3）
tasks.register('downloadMinecraftClient') {
	def target = clientJar.get().asFile
	def localClient = providers.gradleProperty('minecraftClientJar')
	inputs.property('clientJarUrl', project.client_jar_url)
	if (localClient.isPresent()) inputs.file(file(localClient.get()))
	outputs.file(target)
	outputs.upToDateWhen { target.exists() && target.length() > 10_000_000L }
	doLast {
		def expected = project.client_jar_url.toString().split('/objects/')[1].split('/')[0]
		def valid = { target.exists() && java.security.MessageDigest.getInstance('SHA-1').digest(target.bytes).encodeHex().toString() == expected }
		if (localClient.isPresent()) {
			def supplied = file(localClient.get())
			if (java.security.MessageDigest.getInstance('SHA-1').digest(supplied.bytes).encodeHex().toString() != expected) throw new GradleException('本地客户端 SHA-1 校验失败')
			target.parentFile.mkdirs()
			java.nio.file.Files.copy(supplied.toPath(),target.toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			return
		}
		if (valid()) return
		if (gradle.startParameter.offline) throw new GradleException('缺少已校验的官方客户端缓存，请先联网构建')
		target.parentFile.mkdirs()
		logger.lifecycle("下载 Minecraft ${project.minecraft_version} 客户端 jar ...")
		def temporary = new File(target.path + '.part')
		try {
			def connection = URI.create(project.client_jar_url.toString()).toURL().openConnection()
			connection.connectTimeout = 30000; connection.readTimeout = 120000
			connection.inputStream.withCloseable { input -> temporary.withOutputStream { it << input } }
			if (java.security.MessageDigest.getInstance('SHA-1').digest(temporary.bytes).encodeHex().toString() != expected) throw new GradleException('官方客户端 SHA-1 校验失败')
			java.nio.file.Files.move(temporary.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		} finally { temporary.delete() }
		logger.lifecycle("已下载：${target}（${target.length()} 字节）")
	}
}

dependencies {
	// 官方客户端 jar：26.3 未混淆，可直接作为编译依赖
	compileOnly files(clientJar)
	// 注解桩（Mixin / Fabric API / Loader）
	compileOnly sourceSets.mixinStubs.output
}

tasks.named('compileMixinStubsJava') {
	dependsOn 'downloadMinecraftClient'
	options.encoding = 'UTF-8'
	options.release = 25
}

tasks.named('compileJava') {
	dependsOn 'downloadMinecraftClient', 'compileMixinStubsJava'
	options.encoding = 'UTF-8'
	options.release = 25
}

processResources {
	def modVersion = project.version
	inputs.property 'version', modVersion
	filesMatching('fabric.mod.json') {
		expand 'version': modVersion
	}
}

// 每次构建都把产物归档到仓库根的 ./release/<项目名>/（文件名带版本，不会互相覆盖）
tasks.register('archiveArtifact') {
	group = 'build'
	dependsOn 'jar', 'check'
	description = '把构建产物复制到仓库根 ./release/<项目名>/ 留档'
	def artifact = tasks.named('jar').flatMap { it.archiveFile }
	inputs.file(artifact)
	doLast {
		copy {
			from artifact
			into file("release/${project.name}")
		}
		logger.lifecycle("已归档：${artifact.get().asFile.name} → ./release/${project.name}/")
	}
}

tasks.named('build') {
	dependsOn 'archiveArtifact'
}
